# Do not rename this file: GitHub numbers runs per workflow file and the run number is the app build number.
name: Build APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Read-only token unless a job asks for more (each job below names exactly what it needs).
permissions:
  contents: read

jobs:
  # Pull requests: build only, with the default debug key; no secrets, nothing published.
  check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-java@3a4f6e1af504cf6a31855fa899c6aa5355ba6c12 # v4.7.0
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@94baf225fe0a508e581a564467443d0e2379123b # v4.3.0
      - run: ./gradlew testDebugUnitTest assembleRelease --console=plain

  # Pushes to main (and manual runs): signed build + "latest" release.
  apk:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: release # secrets only readable from main
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-java@3a4f6e1af504cf6a31855fa899c6aa5355ba6c12 # v4.7.0
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@94baf225fe0a508e581a564467443d0e2379123b # v4.3.0

      - name: Decode signing key
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build release APK
        shell: bash
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -o pipefail
          ./gradlew testDebugUnitTest assembleRelease --console=plain 2>&1 | tee build.log

      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

      - name: Stage the APK
        run: cp app/build/outputs/apk/release/app-release.apk memento.apk

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: memento-android
          path: memento.apk
          retention-days: 7

  # Windows client: tests, then a single-file exe (every event, nothing published here).
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: windows
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: windows/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt pyinstaller pytest
      - name: Stamp the build number (same as the Android version code)
        shell: bash
        run: echo "BUILD = ${{ github.run_number }}" > memento_win/_version.py
      - name: Tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest tests -q
      - name: Build the exe (one file, Qt filtered by the spec)
        run: pyinstaller --noconfirm memento.spec
      # The built exe checks it carries what it loads at run time (tzdata, the map page, Qt WebEngine, plugins).
      # It is a windowed exe: Start-Process waits for it, the report goes to a file.
      - name: Self-test of the built exe
        timeout-minutes: 5
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist\Memento.exe -ArgumentList '--selftest', 'selftest.txt' -Wait -PassThru
          Get-Content selftest.txt
          if ($p.ExitCode -ne 0) { throw "selftest failed with exit code $($p.ExitCode)" }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: memento-windows
          path: windows/dist/Memento.exe
          retention-days: 7

  # Web app: server and UI tests, then the Docker image (linux/amd64, the NAS is x86_64). Pull requests build
  # it without pushing; main pushes ghcr.io/krustylebot/memento-web:latest and :<run number>.
  webapp:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Server tests
        run: |
          pip install -r webapp/server/requirements.txt -r webapp/tests/requirements.txt
          python -m pytest webapp -q
      - name: UI tests and build
        working-directory: webapp/ui
        run: |
          npm ci --no-audit --no-fund
          npm test
          npm run build
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # Pushed from main only: a manual run on another branch builds without publishing :latest.
      - name: Log in to the GitHub container registry
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build the image, pushed from main only
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        env:
          DOCKER_BUILD_RECORD_UPLOAD: false # no build-record artifact next to the apps' ones
        with:
          context: .
          file: webapp/Dockerfile
          platforms: linux/amd64
          build-args: BUILD=${{ github.run_number }}
          push: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
          tags: |
            ghcr.io/krustylebot/memento-web:latest
            ghcr.io/krustylebot/memento-web:${{ github.run_number }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # One "latest" release carrying both apps, published only when both builds succeeded.
  release:
    needs: [apk, windows]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write # needed to publish the release
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      # only the two apps: the Docker job's build record is not a zip and makes a download-all fail
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dist
          pattern: memento-*
      - name: Publish the "latest" release
        shell: bash
        run: |
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest dist/memento-android/memento.apk dist/memento-windows/Memento.exe \
            --title "Memento build ${{ github.run_number }}" \
            --notes "Build ${{ github.run_number }} of commit ${{ github.sha }}." \
            --target "${{ github.sha }}" \
            --latest
